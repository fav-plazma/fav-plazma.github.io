<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Katedra Fyziky</title>
    <link rel="icon" type="image/x-icon" href="/FAVicon.ico">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
    <script src="transparent-script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>

    <script>
      AFRAME.registerComponent('occluder-material', {
        init: function () {
          // Wait for the model to be loaded
          this.el.addEventListener('model-loaded', () => {
            // Get the THREE.js object
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // Iterate through all parts of the model
            obj.traverse(node => {
              // If this part is a mesh, modify its material
              if (node.isMesh) {
                // This is the magic line:
                // It makes the material invisible (stops it from drawing color)
                node.material.colorWrite = false;
                
                // This line ensures it still "blocks" things behind it
                node.material.depthWrite = true; 
              }
            });
          });
        }
      });
    </script>

  </head>
  <body>
    <a-scene vr-mode-ui="enabled: false" ar-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" landing-page xrextras-loading xrextras-runtime-error renderer="colorManagement:true" xrweb="disableWorldTracking: true">

      <a-assets>
        <video id="03D" src="03D.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="03" src="03_split.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="06D" src="06D.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="07D" src="07D.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="08D" src="08D.mp4" playsinline loop muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <xrextras-named-image-target name="analysis">
        <a-plane position="0 0 0.1" height="0.54" width="1" alpha-video="video: #03" material="blending: additive"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="atomic">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D" material="blending: additive"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="modeling">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="nanomat">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #03D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="optical">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="protective">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #07D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="synthesis">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #08D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="quantum">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="sustainable">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #08D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="vacuum">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

    </a-scene>
  </body>
</html>
