<!doctype html>
<!-- lang is replaced at runtime by the detected language (en/cs/de) -->
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Katedra Fyziky</title>
    <link rel="icon" type="image/x-icon" href="/FAVicon.ico">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
    <script src="transparent-script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="app.js"></script>
    <script>
      AFRAME.registerComponent('occluder-material', {
        init: function () {
          // Wait for the model to be loaded
          this.el.addEventListener('model-loaded', () => {
            // Get the THREE.js object
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // Iterate through all parts of the model
            obj.traverse(node => {
              // If this part is a mesh, modify its material
              if (node.isMesh) {
                // This is the magic line:
                // It makes the material invisible (stops it from drawing color)
                node.material.colorWrite = false;
                
                // This line ensures it still "blocks" things behind it
                node.material.depthWrite = true; 
              }
            });
          });
        }
      });
    </script>

    <style>
      /* Import your custom font here or use @font-face */
      @font-face {
        font-family: 'Atyp';
        src: url('AtypDisplay-Medium.woff') format('woff');
        font-weight: 500;
        font-style: normal;
      }

      /* Custom Loading Screen Container */
      #custom-loader {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #ffffff; /* Loader background */
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
      }

      /* The Lottie Animation Container */
      #lottie-container {
        width: 300px;
        height: 300px;
      }

      /* Custom Target Overlay Container */
      #target-overlay {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 10;
        pointer-events: none; /* Lets you tap through to the AR scene */
        transition: opacity 0.3s ease;
        /* Starts hidden until 8th wall loads, managed by JS */
        opacity: 0; 
      }

      .scan-text {
        position: absolute;
        top: 3%;
        width: 100%;
        text-align: center;
        font-family: 'Atyp', sans-serif; /* Replace with your font */
        font-size: 24px;
        color: #fff;
        /* Keeps the longer German string off the screen edges */
        padding: 0 16px;
        box-sizing: border-box;
      }

      /* The Scanning Bar */
      .scan-bar {
        position: absolute;
        top: 0;
        width: 100%;
        height: 30vh;
        /* 0% top (transparent grey), 100% bottom (solid white) */
        background: linear-gradient(to bottom, rgba(115, 115, 115, 0) 0%, rgba(235, 235, 235, 0.9) 100%);
        /* 1.5s down + 1.5s up = 3s total loop */
        animation: scanAnim 3s linear infinite; 
      }

      @keyframes scanAnim {
        0% { transform: translateY(-30vh) scaleY(1); } /* Hidden above */
        49.99% { transform: translateY(100vh) scaleY(1); } /* Hidden below (1500ms) */
        50% { transform: translateY(100vh) scaleY(-1); } /* Instant 180 flip */
        99.99% { transform: translateY(-30vh) scaleY(-1); } /* Move back up (1500ms) */
        100% { transform: translateY(-30vh) scaleY(1); } /* Instant flip back */
      }

      /* Info button: bottom-right, above everything, shown by JS on active
         target. It links out to the active target's page, so it carries an
         external-link icon. */
      #info-button {
        position: fixed;
        right: 20px;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        min-width: 124px;
        height: 46px;
        padding: 0 18px;
        box-sizing: border-box;
        border: none;
        border-radius: 16px;
        background-color: rgba(255, 255, 255, 0.75);
        color: #111;
        font-family: 'Atyp', sans-serif;
        font-size: 24px;
        line-height: 0.6;
        text-decoration: none;
        z-index: 10001;
        display: none; /* JS sets to flex when a target is active */
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        pointer-events: auto;
      }

      /* The "opens in a new tab" icon */
      #info-button svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

  </head>
  <body>
    <div id="custom-loader">
      <div id="lottie-container"></div>
    </div>

    <div id="target-overlay">
      <!-- English fallback; replaced at runtime by the detected language -->
      <div class="scan-text">Scan the panels on the wall</div>
      <div class="scan-bar"></div>
    </div>

    <!-- Shown only while a target is active. href is set per active target
         by target-tracker, so it opens that target's own page. -->
    <a id="info-button"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="More info (opens in a new tab)">
      <span>More info</span>
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7.85352 7.5H6.85352V1.70703L0.707031 7.85352L0 7.14648L6.14648 1H0.353516V0H7.85352V7.5Z" fill="black"/>
      </svg>
    </a>

    <script>
      var animation = lottie.loadAnimation({
        container: document.getElementById('lottie-container'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'anim_BLK.json' // YOUR LOTTIE FILE PATH GOES HERE
      });
    </script>
    <a-scene
    custom-loading 
    target-tracker
    vr-mode-ui="enabled: false"
    ar-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    landing-page
    xrextras-runtime-error
    renderer="colorManagement:true"
    xrweb="disableWorldTracking: true">

      <a-assets>
        <video id="01" src="09_modra_test_BLUR.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="02" src="09_modra_test_SHARP.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="03" src="03_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="04" src="04_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="05" src="05_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="06" src="06_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="07" src="07_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="08" src="08_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="09" src="09_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="10" src="10_double_bg_new_converted.mp4" playsinline loop muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <xrextras-named-image-target name="analysis">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #09"></a-plane>

    </a-scene>

</html>
