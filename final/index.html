<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Katedra Fyziky</title>
    <link rel="icon" type="image/x-icon" href="/FAVicon.ico">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
    <script src="transparent-script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="app.js"></script>
    <script>
      AFRAME.registerComponent('occluder-material', {
        init: function () {
          // Wait for the model to be loaded
          this.el.addEventListener('model-loaded', () => {
            // Get the THREE.js object
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // Iterate through all parts of the model
            obj.traverse(node => {
              // If this part is a mesh, modify its material
              if (node.isMesh) {
                // This is the magic line:
                // It makes the material invisible (stops it from drawing color)
                node.material.colorWrite = false;
                
                // This line ensures it still "blocks" things behind it
                node.material.depthWrite = true; 
              }
            });
          });
        }
      });
    </script>

    <style>
      /* Import your custom font here or use @font-face */
      @font-face {
        font-family: 'Atyp';
        src: url('AtypDisplay-Medium.woff') format('woff');
        font-weight: 500;
        font-style: normal;
      }

      /* Custom Loading Screen Container */
      #custom-loader {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #ffffff; /* Loader background */
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
      }

      /* The Lottie Animation Container */
      #lottie-container {
        width: 300px;
        height: 300px;
      }

      /* Custom Target Overlay Container */
      #target-overlay {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 10;
        pointer-events: none; /* Lets you tap through to the AR scene */
        transition: opacity 0.3s ease;
        /* Starts hidden until 8th wall loads, managed by JS */
        opacity: 0; 
      }

      .scan-text {
        position: absolute;
        top: 3%;
        width: 100%;
        text-align: center;
        font-family: 'Atyp', sans-serif; /* Replace with your font */
        font-size: 24px;
        color: #fff;
      }

      /* The Scanning Bar */
      .scan-bar {
        position: absolute;
        top: 0;
        width: 100%;
        height: 30vh;
        /* 0% top (transparent grey), 100% bottom (solid white) */
        background: linear-gradient(to bottom, rgba(115, 115, 115, 0) 0%, rgba(235, 235, 235, 0.9) 100%);
        /* 1.5s down + 1.5s up = 3s total loop */
        animation: scanAnim 3s linear infinite; 
      }

      @keyframes scanAnim {
        0% { transform: translateY(-30vh) scaleY(1); } /* Hidden above */
        49.99% { transform: translateY(100vh) scaleY(1); } /* Hidden below (1500ms) */
        50% { transform: translateY(100vh) scaleY(-1); } /* Instant 180 flip */
        99.99% { transform: translateY(-30vh) scaleY(-1); } /* Move back up (1500ms) */
        100% { transform: translateY(-30vh) scaleY(1); } /* Instant flip back */
      }
    </style>

  </head>
  <body>
    <div id="custom-loader">
      <div id="lottie-container"></div>
    </div>

    <div id="target-overlay">
      <div class="scan-text">Naskenuj panely na zdi</div>
      <div class="scan-bar"></div>
    </div>

    <script>
      var animation = lottie.loadAnimation({
        container: document.getElementById('lottie-container'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'anim_BLK.json' // YOUR LOTTIE FILE PATH GOES HERE
      });
    </script>
    <a-scene
    custom-loading 
    target-tracker
    vr-mode-ui="enabled: false"
    ar-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    landing-page
    xrextras-runtime-error
    renderer="colorManagement:true"
    xrweb="disableWorldTracking: true">

      <a-assets>
        <video id="03D" src="03D.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="03" src="03_split.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="06D" src="06D.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="07D" src="07D.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="08D" src="08D.mp4" playsinline loop muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <xrextras-named-image-target name="analysis">
        <a-plane position="0 0 0.1" height="0.54" width="1" alpha-video="video: #03" material="blending: additive"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="atomic">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D" material="blending: additive"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="modeling">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="nanomat">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #03D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="optical">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="protective">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #07D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="synthesis">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #08D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="quantum">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="sustainable">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #08D"></a-plane>
      </xrextras-named-image-target>

      <xrextras-named-image-target name="vacuum">
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
      </xrextras-named-image-target>

    </a-scene>
  </body>
</html>
