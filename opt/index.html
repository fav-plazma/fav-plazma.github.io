<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="sprite-animator.js"></script>

  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: targets_final_3.mind; maxTrack: 2; filterMinCF:0.01; filterBeta: 5000" vr-mode-ui="enabled: false" ar-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" light="defaultLightsEnabled: false">

      <a-assets>
        <img id="nano" src="03D_nanomaterialy.png">
        <img id="magnetron" src="06D_magnetronova_depozice_grid.png">
        <img id="plazma" src="07D_modelovani-a-diagn-plaz_02.png">
        <img id="rust" src="08D_modelovani-rustu-vrstev_02.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 6" animation-mixer>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 7" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" color="blue">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" color="blue">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" color="blue">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 0" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" color="blue">
        </a-plane>
      </a-entity>

    </a-scene>
  </body>
</html>
