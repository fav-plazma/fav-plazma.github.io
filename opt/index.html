<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-geometry-merger-component/dist/aframe-geometry-merger-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/akbartus/A-Frame-Occlusion-Component/js/occlusion-component.js"></script>
    <script src="sprite-animator.js"></script>

    <script>
      AFRAME.registerComponent('occluder-material', {
        init: function () {
          // Wait for the model to be loaded
          this.el.addEventListener('model-loaded', () => {
            // Get the THREE.js object
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            // Iterate through all parts of the model
            obj.traverse(node => {
              // If this part is a mesh, modify its material
              if (node.isMesh) {
                // This is the magic line:
                // It makes the material invisible (stops it from drawing color)
                node.material.colorWrite = false;
                
                // This line ensures it still "blocks" things behind it
                node.material.depthWrite = true; 
              }
            });
          });
        }
      });
    </script>

  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: targets_final_3.mind; maxTrack: 1; filterMinCF:0.0005; filterBeta: 15" vr-mode-ui="enabled: false" ar-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" light="defaultLightsEnabled: false">

      <a-assets>
        <a-asset-item id="opticke" src="01M_opticke-materialy.glb"></a-asset-item>
        <a-asset-item id="udrzitelnost" src="04P_materialy-pro-udrzitelnost_compressed.glb"></a-asset-item>
        <a-asset-item id="kvantove" src="05M_kvantove-materialy.glb"></a-asset-item>
        <a-asset-item id="vakuova" src="09P_vakuova-fyzika_compressed.glb"></a-asset-item>
        <a-asset-item id="charakterizace" src="epik_02_compressed.glb"></a-asset-item>
        <video id="03D" src="03D.mp4" playsinline loop muted crossorigin="anonymous"></video>
        <video id="06D" src="06D.mp4" playsinline loop muted crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 9" animation-mixer>
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.56 0.56 0.56" src="#opticke" animation-mixer>
        </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 5" animation-mixer>
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.8 0.8 0.8" src="#kvantove" animation-mixer>
        </a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 6" animation-mixer>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 7" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #03D"></a-plane>
        <!--<a-plane position="0 0 0.1" height="0.56" width="1" material="shader:flat; transparent: true" sprite-animator="totalFrames: 24; fps: 24; folderPath: 03D">
        </a-plane>--> 
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" material="shader:flat; transparent: true" sprite-animator="totalFrames: 96; fps: 24; folderPath: 06D">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" material="shader:flat; transparent: true" sprite-animator="totalFrames: 24; fps: 24; folderPath: 07D">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 0" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" alpha-video="video: #06D"></a-plane>
        <!--<a-plane position="0 0 0.1" height="0.56" width="1" material="shader:flat; transparent: true" sprite-animator="totalFrames: 96; fps: 24; folderPath: 08D">
        </a-plane>-->
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 8">
        <a-gltf-model
          src="P_occlusion_stena.glb"
          occluder-material  render-order="0"
          scale="0.56 0.56 0.56"
          rotation="0 90 0">
          </a-gltf-model>
        <a-gltf-model
          src="#udrzitelnost"
          animation-mixer
          render-order="1"
          scale="0.56 0.56 0.56"
          rotation="0 90 0">
        </a-gltf-model>
        <a-entity light="color: #BBB; type: ambient; intensity: 3.14"></a-entity>
        <a-entity light="intensity: 5.884; castShadow: true" position="-0.5 1 1"></a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model
          src="P_occlusion_stena.glb"
          occluder-material  render-order="0"
          scale="0.56 0.56 0.56"
          rotation="0 90 0">
          </a-gltf-model>
        <a-gltf-model
          src="#vakuova"
          animation-mixer
          render-order="1"
          scale="0.56 0.56 0.56"
          rotation="0 90 0">
        </a-gltf-model>
        <a-entity light="color: #BBB; type: ambient; intensity: 3.14"></a-entity>
        <a-entity light="intensity: 5.884; castShadow: true" position="-0.5 1 1"></a-entity>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model
          src="P_occlusion_stena.glb"
          occluder-material  render-order="0"
          scale="0.56 0.56 0.56"
          rotation="0 90 0">
          </a-gltf-model>
        <a-gltf-model
          src="#charakterizace"
          animation-mixer
          render-order="1"
          scale="0.56 0.56 0.56"
          rotation="0 90 0">
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html>
