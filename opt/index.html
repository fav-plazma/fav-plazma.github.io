<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="sprite-animator.js"></script>

  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: targets_final_3.mind; maxTrack: 2; filterMinCF:0.001; filterBeta: 10" vr-mode-ui="enabled: false" ar-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" light="defaultLightsEnabled: false">

      <a-assets>
        <a-asset-item id="opticke" src="01M_opticke-materialy.glb"></a-asset-item>
        <img id="nano" src="03D_nanomaterialy.png">
        <a-asset-item id="udrzitelnost" src="04P_materialy-pro-udrzitelnost_compressed.glb"></a-asset-item>
        <a-asset-item id="kvantove" src="05M_kvantove-materialy.glb"></a-asset-item>
        <img id="magnetron" src="06D_magnetronova_depozice_grid.png">
        <img id="plazma" src="07D_modelovani-a-diagn-plaz_02.png">
        <img id="rust" src="08D_modelovani-rustu-vrstev_02.png">
        <a-asset-item id="vakuova" src="09P_vakuova-fyzika_compressed.glb"></a-asset-item>
        <a-asset-item id="charakterizace" src="10P_charakterizace-mat_compressed.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 6" animation-mixer>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 7" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" material="src: #nano; shader:flat; transparent: true" sprite-animator="cols: 1; rows: 24; totalFrames: 24; fps: 24;">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" material="src: #magnetron; shader:flat; transparent: true" sprite-animator="cols: 8; rows: 12; totalFrames: 96; fps: 24;">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" material="src: #plazma; shader:flat; transparent: true" sprite-animator="cols: 1; rows: 24; totalFrames: 24; fps: 24;">
        </a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 0" animation-mixer>
        <a-plane position="0 0 0.1" height="0.56" width="1" material="src: #rust; shader:flat; transparent: true" sprite-animator="cols: 8; rows: 12; totalFrames: 96; fps: 24;">
        </a-plane>
      </a-entity>

    </a-scene>
  </body>
</html>
